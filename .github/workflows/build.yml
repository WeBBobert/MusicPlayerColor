name: Build tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Add libgcuniversal (needed by the settings bundle)
        run: |
          test -f lib/libgcuniversal.dylib || { echo "Missing lib/libgcuniversal.dylib - copy it from your device into the repo's lib/ folder"; exit 1; }
          mkdir -p "$HOME/theos/lib"
          cp lib/libgcuniversal.dylib "$HOME/theos/lib/"

      - name: Build
        run: gmake package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerColor-deb
          path: packages/*.deb
